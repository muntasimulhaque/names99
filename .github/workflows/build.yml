name: Build APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Nothing here writes to the repository.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up JDK 17
        uses: actions/setup-java@d7793b545071e98d581d3bf084a51c3213318a07 # v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d # v4
        with:
          gradle-version: "9.5.0"

      - name: Run unit tests
        run: gradle testDebugUnitTest

      # Compose lint catches what tests cannot: unused resources, missing
      # semantics, hardcoded text. Fails the build on new issues.
      - name: Lint
        run: gradle lintDebug

      - name: Build debug APK
        run: gradle assembleDebug

      # The only build that ever reaches Google Play is minified and
      # resource-shrunk. Building it here means R8 is exercised on every
      # change, instead of for the first time on the day of a release.
      - name: Build release (minified, unsigned)
        run: gradle assembleRelease

      - name: Upload APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: 99-names-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          # This is a debuggable build on a public repository. Recent ones are
          # there for device testing; older ones needn't linger for 90 days.
          retention-days: 7
