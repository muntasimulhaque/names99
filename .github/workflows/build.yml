name: Build APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Nothing here writes to the repository.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Run unit tests
        run: gradle testDebugUnitTest

      - name: Build debug APK
        run: gradle assembleDebug

      # The only build that ever reaches Google Play is minified and
      # resource-shrunk. Building it here means R8 is exercised on every
      # change, instead of for the first time on the day of a release.
      - name: Build release (minified, unsigned)
        run: gradle assembleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: 99-names-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          # This is a debuggable build on a public repository. Recent ones are
          # there for device testing; older ones needn't linger for 90 days.
          retention-days: 7
