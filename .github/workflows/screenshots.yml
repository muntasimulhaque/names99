name: Capture Play screenshots

# Builds the debug APK, boots an emulator, opens the real app, and captures the
# screenshots that feed the Play Store listing. Run on demand (workflow_dispatch)
# after a UI change; the PNGs land as a downloadable artifact named "screenshots".

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.5.0"

      - name: Build debug APK
        run: gradle assembleDebug

      - name: Capture screenshots
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_4
          disable-animations: true
          script: |
            bash .github/scripts/capture.sh

      - name: Upload screenshots
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: /tmp/shot-*.png
          if-no-files-found: error