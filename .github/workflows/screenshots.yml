name: Capture Play screenshots

# Builds the debug APK once per device, boots a phone, 7-inch and 10-inch
# emulator, opens the real app, and captures the four screens that feed the Play
# listing (home light, name, home dark, quiz). Run on demand (workflow_dispatch).
# Artifacts: screenshots-<device>/<device>-home.png, -name.png, -home-dark.png, -quiz.png

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  screenshots:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - device: phone
            profile: pixel_4
          - device: 7in
            profile: Nexus 7
          - device: 10in
            profile: Nexus 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.5.0"

      - name: Build debug APK
        run: gradle assembleDebug

      - name: Install Pillow (blank-frame detection)
        run: python3 -m pip install --quiet Pillow

      - name: Capture screenshots (${{ matrix.device }})
        uses: reactivecircus/android-emulator-runner@2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: ${{ matrix.profile }}
          disable-animations: true
          script: |
            bash .github/scripts/capture.sh ${{ matrix.device }}

      - name: Upload ${{ matrix.device }} screenshots
        uses: actions/upload-artifact@v4
        with:
          name: screenshots-${{ matrix.device }}
          path: /tmp/${{ matrix.device }}-*.png