name: Capture Play screenshots

# Builds the debug APK, boots an emulator, opens the real app, and captures the
# screenshots that feed the Play Store listing. Run on demand (workflow_dispatch)
# after a UI change; the PNGs land as a downloadable artifact named "screenshots".

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.5.0"

      - name: Build debug APK
        run: gradle assembleDebug

      - name: Capture screenshots
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_4
          disable-animations: true
          script: |
            set -e
            PKG=io.github.muntasimulhaque.ninetynine
            APK=app/build/outputs/apk/debug/app-debug.apk

            adb install -r "$APK"

            # Tap the first UI element whose text contains "$1".
            tap_text() {
              adb shell uiautomator dump /sdcard/ui.xml >/dev/null 2>&1 || true
              adb pull /sdcard/ui.xml /tmp/ui.xml >/dev/null 2>&1 || true
              local xy
              xy=$(python3 .github/scripts/tap_text.py "$1" /tmp/ui.xml)
              if [ -n "$xy" ]; then adb shell input tap $xy; fi
            }

            # 1) Home, light
            adb shell am start -W -n $PKG/.MainActivity
            sleep 5
            adb exec-out screencap -p > /tmp/shot-home.png

            # 2) Name page (deep-link to the first name)
            adb shell am start -W -n $PKG/.MainActivity --ei nameNumber 1
            sleep 4
            adb exec-out screencap -p > /tmp/shot-name.png

            # 3) Home, dark
            adb shell cmd uimode night yes
            adb shell am start -W -n $PKG/.MainActivity
            sleep 5
            adb exec-out screencap -p > /tmp/shot-home-dark.png

            # 4) Quiz: Memorize tab -> Quiz, back to light
            adb shell cmd uimode night no
            adb shell am start -W -n $PKG/.MainActivity
            sleep 4
            tap_text "Memorize"
            sleep 3
            tap_text "Quiz"
            sleep 4
            adb exec-out screencap -p > /tmp/shot-quiz.png

      - name: Upload screenshots
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: /tmp/shot-*.png
          if-no-files-found: error